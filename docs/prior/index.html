const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(xs)=>xs.map(x=>'<option>'+esc(x)+'</option>').join('');
const unique=x=>Array.from(new Set(x));
const modes=g=>g.events.length?unique(g.events.map(e=>e.mode)):['基因级'];
$('trait').insertAdjacentHTML('beforeend',options(unique(genes.flatMap(g=>g.categories)).sort()));
$('qual').insertAdjacentHTML('beforeend',options(['完整多位点型','部分多位点型','单个位点','待定位或待补状态','基因级']));
const links=xs=>xs.map(x=>'<a href="'+esc(x)+'" target="_blank" rel="noopener noreferrer">'+esc(x.replace(/^https?:\/\/(?:www\.)?/,'').replace(/\/$/,''))+' ↗</a>').join(' ');
let active=genes.find(g=>g.id===decodeURIComponent(location.hash.slice(1)))||genes[0],groups=[],groupIndex=0;
function filter(){
 const q=$('q').value.trim().toLowerCase(),t=$('trait').value,m=$('qual').value;
 return genes.filter(g=>(!t||g.categories.includes(t))&&(!m||modes(g).includes(m))&&[g.name,g.id,g.msu,g.aliases,g.trait].join(' ').toLowerCase().includes(q));
}
function listing(reset){
 const found=filter();if(reset&&!found.includes(active)){active=found[0];groupIndex=0}
 $('count').textContent=found.length+' / '+genes.length+' 个基因';$('list').innerHTML=found.map(g=>'<button class="item" aria-current="'+(g===active)+'" data-id="'+esc(g.id)+'"><b>'+esc(g.name)+'</b><span>'+esc(g.trait)+'</span></button>').join('');
 $('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=genes.find(g=>g.id===b.dataset.id);groupIndex=0;history.replaceState(null,'','#'+active.id);listing(false);render();if(innerWidth<760)$('gene').scrollIntoView()});
}
for(const id of ['q','trait','qual'])$(id).addEventListener('input',()=>{groupIndex=0;listing(true);render()});
function buildGroups(g){
 const map=new Map();for(const e of g.events){
  const key=JSON.stringify([e.chr,e.source,e.cols.map(c=>[c[0],c[1]]),e.cols.every(c=>c[0]===null)?e.siteOrder||e.id:'']);
  if(!map.has(key))map.set(key,[]);map.get(key).push(e)}
 return [...map.values()].sort((a,b)=>priority(a)-priority(b));
}
function priority(a){return Math.min(...a.map(e=>['完整多位点型','部分多位点型','单个位点','待定位或待补状态'].indexOf(e.mode)))}
function track(g,ev){
 const m=g.model,p=unique(ev.flatMap(e=>e.cols.map(c=>c[0]).filter(Number.isFinite)));
 const panel=local&&!p.length?unique(g.counts.map(z=>Number(z.position))):[],points=p.length?p:panel;
 const low=Math.min(m.start,m.promoter[0],...points),high=Math.max(m.end,m.promoter[1],...points),L=50,W=790,x=n=>L+(n-low)/(high-low||1)*W;
 const line=(a,b,y,color,width)=>'<line x1="'+x(a)+'" x2="'+x(b)+'" y1="'+y+'" y2="'+y+'" stroke="'+color+'" stroke-width="'+width+'"/>';
 const block=(a,b,y,h,color)=>'<rect x="'+x(a)+'" width="'+Math.max(2,x(b)-x(a))+'" y="'+y+'" height="'+h+'" fill="'+color+'"/>';
 let s='<svg viewBox="0 0 890 111" aria-label="'+esc(g.name)+' 基因结构和位点" role="img"><text x="50" y="18" fill="#466250" font-size="12">'+esc(m.chr)+' · '+low.toLocaleString()+' – '+high.toLocaleString()+' bp</text>';
 s+=line(low,high,80,'#bac9bf',1)+line(m.start,m.end,56,'#496b5f',2)+block(...m.promoter,49,14,'#cec99a')+m.cds.map(c=>block(...c,47,18,'#246c54')).join('');
 for(let i=0;i<=4;i++){const v=Math.round(low+(high-low)*i/4),align=i===0?'start':i===4?'end':'middle';s+='<text x="'+x(v)+'" y="99" text-anchor="'+align+'" fill="#506659" font-size="12">'+v.toLocaleString()+'</text>'}
 for(const pos of points){s+='<g><title>'+esc(m.chr)+':'+pos+'</title><line x1="'+x(pos)+'" x2="'+x(pos)+'" y1="30" y2="46" stroke="#a34b30"/><circle r="3" cx="'+x(pos)+'" cy="30" fill="#a34b30"/></g>'}
 s+='<text x="840" y="18" text-anchor="end" fill="#305a45" font-size="14">'+(m.strand==='+'?'正链 →':'← 负链')+'</text></svg>';
 return '<div class="scroll">'+s+'</div><div class="legend"><span><i style="color:#246c54">■</i>CDS</span><span><i style="color:#b9ae65">■</i>上游 2 kb</span><span><i style="color:#a34b30">●</i>'+(p.length?'当前记录的已定位点':panel.length?'现代面板目标位置':'暂无可定位事件')+'</span></div><div class="sub">'+esc(m.transcript)+' · '+esc(m.source||'MSU7')+' · 各基因独立缩放。启动子窗口按所示转录本的链方向取值。</div>';
}
function base(v){const s=v??'NA';return '<td class="base '+(/^[ACGT]$/.test(s)?s:s==='NA'?'unknown':'')+'" title="'+esc(s)+'">'+esc(s.length>14?s.slice(0,6)+'…'+s.slice(-4)+' ('+s.length+' bp)':s)+'</td>'}
function matrix(arr){
 const e=arr[0],multi=e.cols.length>1,hasMatch=local&&arr.some(x=>x.match);
 const tally=x=>x.match?.status==='全组分可比较'?x.match.matched:x.match?.status||'—';
 if(!multi&&e.cols[0].every(x=>x===null))return '<div class="empty">此文献记录尚缺参考坐标与等位序列。</div>';
 return '<div class="scroll"><table class="matrix"><thead><tr><th>来源记录 / MSU7 正链</th>'+e.cols.map((c,i)=>'<th>'+(multi?(i+1)+' · ':'')+esc(c[0]??'位置 NA')+'</th>').join('')+(hasMatch?'<th>籼稻纯合匹配数</th>':'')+'</tr></thead><tbody><tr><th>日本晴参考序列</th>'+e.cols.map(c=>base(c[1])).join('')+(hasMatch?'<td>—</td>':'')+'</tr>'+arr.map(x=>'<tr><th>'+esc(x.label)+'</th>'+x.cols.map(c=>base(c[2])).join('')+(hasMatch?'<td>'+esc(tally(x))+'</td>':'')+'</tr>').join('')+'</tbody></table></div><p class="sub">列按原文次序排列。多位点格为文献报告状态，可以与日本晴相同。NA 表示未知；未定位组分的碱基保留原文方向。单个位点的斜线分隔多个备选等位。</p>';
}
function details(arr){
 return arr.map(e=>'<details class="detail"><summary>'+esc(e.label)+' · '+esc(e.mode)+'</summary><p class="annotation">'+esc([e.kind,e.evidence,e.trait,e.effect].filter(Boolean).join(' · '))+'</p>'+(e.siteOrder?'<p class="annotation">原文位点次序　'+esc(e.siteOrder)+'</p>':'')+(e.mapping?'<p class="warning">'+esc(e.mapping)+'</p>':'')+(e.match?'<p class="annotation">面板位置覆盖 '+e.match.covered+'/'+e.match.components+'。'+(e.match.matched!==''?' 本型纯合 '+e.match.matched+'，其他完整纯合 '+e.match.other_complete+'，缺失 '+e.match.missing+'，未分相杂合 '+e.match.unphased_het+'。':' '+esc(e.match.status)+'。')+'</p>':'')+'<div class="links">'+links(e.source)+'</div></details>').join('');
}
function localPanel(g){
 const e=g.panel;let h='<section class="card"><h2>现代籼稻复核</h2><strong>'+esc(e.status)+'</strong><p>'+esc(e.note)+'</p>';
 if(g.tests.length)h+='<div class="scroll"><table class="matrix"><thead><tr><th>分型 / 对照</th><th>性状与环境</th><th>两组 n</th><th>调整差值 [95% CI]</th><th>Holm P</th></tr></thead><tbody>'+g.tests.map(r=>'<tr><th>'+esc(r.gene+' '+r.effect_state+' / '+r.control_state)+'</th><td>'+esc(r.trait+' · '+r.site+' '+r.year)+'</td><td>'+r.n_effect+' / '+r.n_control+'</td><td>'+(r.status==='estimated'?Number(r.beta).toFixed(3)+' ['+Number(r.ci_low).toFixed(3)+', '+Number(r.ci_high).toFixed(3)+']':'不可估')+'</td><td>'+(r.status==='estimated'?Number(r.holm_all_23).toPrecision(3):'—')+'</td></tr>').join('')+'</tbody></table></div>';
 if(g.counts.length)h+='<details class="detail"><summary>查看目标坐标与纯合基因型人数（'+g.counts.length+' 个坐标记录）</summary><div class="scroll"><table class="matrix"><thead><tr><th>MSU7 / 参考</th><th>覆盖</th>'+['A/A','C/C','G/G','T/T','杂合','缺失'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+g.counts.map(r=>'<tr><th>'+esc(r.chromosome+':'+r.position+' · '+r.reference)+'</th><td>'+esc(r.status)+'</td>'+['A','C','G','T','het','missing'].map(k=>'<td>'+esc(r[k]||'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';
 return h+'<p class="sub">2,354 份现代籼稻中，2,347 份精确匹配分型，可用表型人数随性状和环境变化。完整纯合组合按顺序匹配；结构事件另需相应分型。</p></section>';
}
function exportGene(g){
 const t=[['gene','record','type','chr','position_in_source_order','reference','reported_state','source','population_match','complete_other','missing','unphased_het'],...g.events.map(e=>[g.name,e.label,e.mode,e.chr||'NA',...([0,1,2].map(i=>e.cols.map(c=>c[i]??'NA').join(','))),e.source.join(' | '),...[ 'matched','other_complete','missing','unphased_het'].map(k=>e.match?.[k]??'')])];
 if(!g.events.length)t.push([g.name,g.literature,'基因级',g.model.chr,'NA','NA','NA',g.sources.join(' | '),'','','','']);
 const blob=new Blob(['\uFEFF'+t.map(r=>r.map(x=>String(x).replace(/[\t\r\n]/g,' ')).join('\t')).join('\n')+'\n'],{type:'text/tab-separated-values;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=g.id+'.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function render(){
 const g=active;if(!g){$('gene').innerHTML='<div class="empty">没有符合筛选条件的基因。可更换性状或输入别名。</div>';return}
 groups=buildGroups(g);if(groupIndex>=groups.length)groupIndex=0;const arr=groups[groupIndex]||[];
 $('gene').innerHTML='<p class="tag">'+(local?'本地版 · 文献先验与现代籼稻':'公开版 · 文献先验')+'</p><div class="heading"><h1>'+esc(g.name)+'</h1><span class="chip">'+esc(g.trait)+'</span></div><p class="idline">'+esc([g.rap,g.msu,g.aliases].filter(Boolean).join(' · '))+'</p><p class="summary">'+esc(g.literature)+'</p><div class="links">'+links(g.geneSources)+'</div><section class="card"><div class="split"><h2>基因结构与位点</h2><button class="action" id="download">导出该基因 TSV ↓</button></div>'+(groups.length?'<label class="field" for="group">文献记录组（同来源、同坐标序列）</label><select id="group" class="pick">'+groups.map((a,i)=>'<option value="'+i+'" '+(i===groupIndex?'selected':'')+'>'+esc(a[0].label)+' · '+a.length+' 条</option>').join('')+'</select>':'')+track(g,arr)+'</section><section class="card"><h2>等位状态与单倍型</h2>'+(arr.length?matrix(arr)+details(arr):'<p class="empty">当前收录了该基因的作用和原文。此版本尚无可并列展示的来源状态组。</p>')+'</section>'+(local?localPanel(g):'')+'<section class="card"><h2>身份与原始研究</h2><div class="links"><a href="'+esc(g.identity)+'" target="_blank" rel="noopener noreferrer">RiceData 基因身份 ↗</a>'+links(g.sources)+'</div></section>';
 $('download').onclick=()=>exportGene(g);if($('group'))$('group').onchange=e=>{groupIndex=Number(e.target.value);render();$('group').focus()};
}
listing(false);render();
</script></body></html>
